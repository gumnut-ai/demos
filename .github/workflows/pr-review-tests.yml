name: PR review workflow checks
on:
  pull_request:
    paths: ['.github/pr-review/**', '.github/workflows/pr-review*']
  push:
    branches: [main]
    paths: ['.github/pr-review/**', '.github/workflows/pr-review*']
permissions:
  contents: read
jobs:
  review-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load pinned native review runtime for contract tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github/gh-aw
          ref: c35393777e5604a63721d09512263b1383301d4f
          path: .native-gh-aw
          persist-credentials: false
          sparse-checkout: actions/setup/js
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node --test .github/pr-review/reviewer*.test.cjs
        env:
          GH_AW_ACTIONS_DIR: ${{ github.workspace }}/.native-gh-aw/actions/setup/js
      - name: Check generated review workflow matches source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          compiler="${RUNNER_TEMP}/gh-aw-v0.89.21"
          curl --fail --silent --show-error --location \
            https://github.com/github/gh-aw/releases/download/v0.89.21/linux-amd64 \
            --output "$compiler"
          echo "1c74ff5fc28b1891d32b67f4348a9b7f750946b6d4a721e909187a848868016b  $compiler" | sha256sum --check
          chmod +x "$compiler"
          "$compiler" compile pr-review --action-tag c35393777e5604a63721d09512263b1383301d4f --no-check-update
          python3 .github/pr-review/reviewer-compile.py
          git diff --exit-code -- .github/workflows/pr-review.lock.yml
